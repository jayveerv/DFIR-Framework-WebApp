name: Unpack and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded project zip (one time)
        run: |
          if [ -f project.zip ]; then
            unzip -o -q project.zip
            rm project.zip
            git config user.name "jayveerv"
            git config user.email "jayveerv@users.noreply.github.com"
            git add -A
            git commit -m "Add CP-DFIR Framework source"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
